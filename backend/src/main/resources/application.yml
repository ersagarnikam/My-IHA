spring:
  application:
    name: iha-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

iha:
  jwt:
    # HMAC-SHA256 signing secret, at least 32 bytes. Override via IHA_JWT_SECRET outside dev.
    secret: ${IHA_JWT_SECRET}
    ttl: 8h
  crypto:
    # Base64-encoded 32-byte AES key for column-level PII encryption.
    # Override via IHA_PII_KEY outside dev; rotating it makes existing rows unreadable.
    pii-key: ${IHA_PII_KEY}
  storage:
    root: ${IHA_STORAGE_ROOT:./data/storage}
  cors:
    allowed-origins: ${IHA_CORS_ORIGINS:http://localhost:5173}
  verification:
    code-ttl: 15m
    max-attempts: 5
  payments:
    # fake = simulated payments for local development; stripe = real card payments.
    provider: ${IHA_PAYMENTS_PROVIDER:fake}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  messaging:
    # Public address of the portal, for links in emails.
    portal-url: ${IHA_PORTAL_URL:http://localhost:5173}
    resend:
      api-key: ${RESEND_API_KEY:}
      from-address: ${RESEND_FROM_ADDRESS:MTA <onboarding@resend.dev>}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      phone-number: ${TWILIO_PHONE_NUMBER:}
      base-url: ${TWILIO_BASE_URL:https://api.twilio.com}
  zoom:
    account-id: ${ZOOM_ACCOUNT_ID:}
    client-id: ${ZOOM_CLIENT_ID:}
    client-secret: ${ZOOM_CLIENT_SECRET:}
  admin:
    # First admin account, created on startup if this email doesn't exist yet (admins can't sign up).
    bootstrap-email: ${IHA_ADMIN_EMAIL:}
    bootstrap-password: ${IHA_ADMIN_PASSWORD:}
  retention:
    # Daily hard delete of patient accounts past their 30-day deletion grace period.
    cron: "0 30 3 * * *"
